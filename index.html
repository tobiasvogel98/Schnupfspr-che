<!DOCTYPE html>
<html lang="de-CH">
<head>

<title>Schnupf-Sprüch Sammlig</title>
<style>
  :root{
    --bg:#1c140d;
    --bg2:#2a1d12;
    --card:#3a281a;
    --card-hover:#48321f;
    --accent:#e0a955;
    --accent2:#c97b2c;
    --text:#f3e7d6;
    --muted:#b89c7d;
    --border:#5a3f28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));
    color:var(--text);
    min-height:100vh;
  }
  header{
    text-align:center;
    padding:34px 16px 18px;
    border-bottom:2px solid var(--border);
    background:rgba(0,0,0,.2);
  }
  header h1{
    margin:0;
    font-size:clamp(28px,5vw,46px);
    letter-spacing:1px;
    color:var(--accent);
    text-shadow:0 2px 0 #000;
  }
  .title-icon{
    height:0.8em;
    width:auto;
    vertical-align:-0.1em;
    margin:0 10px;
  }
  header p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:15px;
  }
  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(28,20,13,.96);
    backdrop-filter:blur(4px);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:center;
  }
  .search-wrap{
    position:relative;
    flex:1 1 420px;
    max-width:620px;
  }
  #search{
    width:100%;
    padding:13px 44px 13px 16px;
    font-size:16px;
    border-radius:30px;
    border:2px solid var(--border);
    background:var(--card);
    color:var(--text);
    outline:none;
    transition:border-color .15s;
  }
  #search:focus{border-color:var(--accent);}
  #search::placeholder{color:var(--muted);}
  .search-wrap .icon{
    position:absolute;
    right:16px;top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
    font-size:18px;
  }
  #clear{
    position:absolute;
    right:14px;top:50%;
    transform:translateY(-50%);
    background:none;border:none;
    color:var(--muted);
    font-size:20px;cursor:pointer;
    display:none;
    line-height:1;
  }
  .count{
    color:var(--muted);
    font-size:14px;
    white-space:nowrap;
  }
  .count b{color:var(--accent);}
  main{
    max-width:1200px;
    margin:0 auto;
    padding:22px 16px 40px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 20px;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
    transition:transform .12s,background .12s,box-shadow .12s;
    display:flex;
    flex-direction:column;
  }
  .card:hover{
    transform:translateY(-3px);
    background:var(--card-hover);
    box-shadow:0 8px 18px rgba(0,0,0,.35);
  }
  .card h2{
    margin:0 0 10px;
    font-size:19px;
    color:var(--accent);
    border-bottom:1px solid var(--border);
    padding-bottom:8px;
  }
  .card .verse{
    white-space:pre-line;
    line-height:1.5;
    font-size:15px;
    color:var(--text);
  }
  mark{
    background:var(--accent);
    color:#1c140d;
    border-radius:3px;
    padding:0 2px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 16px;
    font-size:18px;
  }
  .pager{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:30px;
  }
  .pager button{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    min-width:42px;
    transition:background .12s,border-color .12s;
  }
  .pager button:hover:not(:disabled){border-color:var(--accent);}
  .pager button.active{
    background:var(--accent);
    color:#1c140d;
    border-color:var(--accent);
    font-weight:700;
  }
  .pager button:disabled{opacity:.35;cursor:not-allowed;}
  .pager .dots{color:var(--muted);padding:0 4px;}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px;
    border-top:1px solid var(--border);
  }
</style>
</head>

  {t:`Vier Jahreszeiten`, v:`Im Winter ist es halt schon so gehalten

  {t:`Jesus sprach`, v:`Jesus sprach zu Gott, Du bist alt

  {t:`Bier`, v:`Als ich dich zum ersten Mal sah,

  {t:`Vibrator`, v:`Der Vibrator ist ein Apparat,

  {t:`Schöne Frauen`, v:`Was den schönen Frauen gefällt,

  {t:`heisser Tag`, v:`Ein heisser Tag, sie zieht sich aus,

  {t:`Sack- Schnupftabak`, v:`Lieber numme eis Ei im Sack,

  {t:`Der Winter`, v:`Draussen liegt noch etwas Schnee,

  {t:`Priester`, v:`Fällt der Blick ins Glas mal etwas tiefer,

  {t:`Vor dem Essen`, v:`Steht das Essen auf dem Tisch,

  {t:`Einerlei`, v:`Rede nicht zu lang um den heissen Brei,

  {t:`Eine Weisheit`, v:`Trinke viel und spiel dazu

  {t:`Ramseier Apfelsaft`, v:`Willst du scheissen ohne Kraft,

  {t:`Drei Zwerge`, v:`Doben auf dem Berge,

  {t:`Neubau`, v:`Wenn dr Sanitär is Röhrli pisst

  {t:`Zürichsee`, v:`Schwimmt ein Hund im Zürichsee

  {t:`Teigwaren`, v:`Warum heissen Teigwaren Teigwaren,

  {t:`Egal`, v:`Egal ob Sunnä oder Rägä

  {t:`Alkohol ist gesund`, v:`Nach 30 Jahren stirbt ein Pferd,

  {t:`Längwilig`, v:`Isches ruhig im ganzä Land,

const grid    = document.getElementById('grid');
const pager   = document.getElementById('pager');
const countEl = document.getElementById('count');
const search  = document.getElementById('search');
const clearBtn= document.getElementById('clear');

let filtered = sprueche.slice();
let page = 1;
let query = '';

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function highlight(text){
  const safe = escapeHtml(text);
  if(!query) return safe;
  const re = new RegExp('('+escapeReg(query)+')','gi');
  return safe.replace(re,'<mark>$1</mark>');
}

function applyFilter(){
  query = search.value.trim();
  const q = query.toLowerCase();
  filtered = q
    ? sprueche.filter(s => s.t.toLowerCase().includes(q) || s.v.toLowerCase().includes(q))
    : sprueche.slice();
  page = 1;
  clearBtn.style.display = query ? 'block' : 'none';
  render();
}

function render(){
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  if(page > pages) page = pages;
  const start = (page-1)*PER_PAGE;
  const slice = filtered.slice(start, start+PER_PAGE);

  // count text
  if(query){
    countEl.innerHTML = `<b>${total}</b> Treffer für "${escapeHtml(query)}"`;
  }else{
    countEl.innerHTML = `<b>${sprueche.length}</b> Sprüch insgesamt`;
  }

  // cards
  if(total === 0){
    grid.innerHTML = `<div class="empty">🤷 Kei Spruch gfunde. Probier öppis anders.</div>`;
    pager.innerHTML = '';
    return;
  }
  grid.innerHTML = slice.map(s =>
    `<article class="card">
       <h2>${highlight(s.t)}</h2>
       <div class="verse">${highlight(s.v)}</div>
     </article>`
  ).join('');

  renderPager(pages);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderPager(pages){
  if(pages <= 1){ pager.innerHTML = ''; return; }
  let html = '';
  html += `<button ${page===1?'disabled':''} data-p="${page-1}">‹ Zrugg</button>`;

  const nums = [];
  const add = n => { if(!nums.includes(n) && n>=1 && n<=pages) nums.push(n); };
  add(1); add(2);
  add(page-1); add(page); add(page+1);
  add(pages-1); add(pages);
  nums.sort((a,b)=>a-b);

  let prev = 0;
  for(const n of nums){
    if(n - prev > 1) html += `<span class="dots">…</span>`;
    html += `<button class="${n===page?'active':''}" data-p="${n}">${n}</button>`;
    prev = n;
  }
  html += `<button ${page===pages?'disabled':''} data-p="${page+1}">Wiiter ›</button>`;
  pager.innerHTML = html;

  pager.querySelectorAll('button[data-p]').forEach(b=>{
    b.addEventListener('click',()=>{
      page = parseInt(b.dataset.p,10);
      render();
    });
  });
}

search.addEventListener('input', applyFilter);
clearBtn.addEventListener('click', ()=>{ search.value=''; applyFilter(); search.focus(); });

render();
</script>
